name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPER_ADMIN_USERNAME: ${{ secrets.SUPER_ADMIN_USERNAME }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          BRANCH_MANAGER_USERNAME: ${{ secrets.BRANCH_MANAGER_USERNAME }}
          BRANCH_MANAGER_PASSWORD: ${{ secrets.BRANCH_MANAGER_PASSWORD }}
          SALES_STAFF_USERNAME: ${{ secrets.SALES_STAFF_USERNAME }}
          SALES_STAFF_PASSWORD: ${{ secrets.SALES_STAFF_PASSWORD }}
          PRODUCTION_STAFF_USERNAME: ${{ secrets.PRODUCTION_STAFF_USERNAME }}
          PRODUCTION_STAFF_PASSWORD: ${{ secrets.PRODUCTION_STAFF_PASSWORD }}
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  report:
    name: Publish Test Report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Publish Test Report
        uses: actions/upload-pages-artifact@v3
        with:
          path: all-reports

  notify:
    name: Notify on Failure
    needs: test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Send notification
        run: |
          echo "E2E tests failed on scheduled run"
          # Add your notification logic here (Slack, email, etc.)
